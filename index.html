<!DOCTYPE html>
<html>
<head>
    <title>Healthcare CRM</title>
    <link rel="stylesheet" href="style.css">

    <!-- ✅ Genesys Embeddable Framework -->
    <script src="https://apps.usw2.pure.cloud/crm/embeddableFramework.js"></script>
</head>

<body>

<!-- ✅ HEADER -->
<header class="header">
    <div class="logo">CCare</div>

    <input type="text" class="search" placeholder="Search...">

    <div class="top-right">
        <span>User</span>
        <button class="logout">Log Out</button>
    </div>
</header>

<!-- ✅ NAVBAR -->
<nav class="navbar">
    <a class="active">CCare</a>
    <a>Plans</a>
    <a>Claims</a>
    <a>Contact Us</a>
    <a>My Account</a>
</nav>

<!-- ✅ HERO SECTION -->
<section class="hero">
    <div class="hero-text">
        <h1>Health plans</h1>
        <p>Enjoy the freedom to live fearless.</p>
        <button class="btn">Click here</button>
    </div>
</section>

<!-- ✅ CRM SECTION -->
<div class="container">

    <h2>Add Patient</h2>
    <input type="text" id="name" placeholder="Patient Name">
    <input type="email" id="email" placeholder="Email">
    <input type="text" id="phone" placeholder="Phone">
    <button onclick="addCustomer()">Add</button>

    <h2>Patient List</h2>
    <table id="customerTable">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Action</th>
        </tr>
    </table>

</div>

<!-- ✅ ✅ FLOATING SOFTPHONE (LIKE YOUR IMAGE) -->
<div class="softphone">
    <iframe 
        id="softphone"
        allow="camera *; microphone *"
        src="https://apps.usw2.pure.cloud/crm/index.html?crm=framework-local-secure">
    </iframe>
</div>

<script src="script.js"></script>

</body>
</html>
