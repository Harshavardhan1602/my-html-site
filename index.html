<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cognizant CRM</title>

  <link rel="stylesheet" href="styles.css" />

  <!-- Genesys Config -->
  <script>
    window.PURECLOUD_EMBED_CONFIG = {
      clientId: "226182a8-bb53-435b-bc3c-2140f077768f",
      region: "usw2.pure.cloud"
    };
  </script>

</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">Cognizant CRM</div>
    <nav>
      <a href="#">Products</a>
      <a href="#">Industries</a>
      <a href="#">Learning</a>
      <a href="#">Support</a>
      <a href="#">Company</a>
    </nav>
    <div class="nav-actions">
      <a href="#">Login</a>
      <button class="btn primary">Try for free</button>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="hero-text">
      <h1>Drive growth and cost savings with Cognizant CRM</h1>
      <p>
        Deliver seamless customer experiences across multiple touchpoints
        with intelligent automation and cloud integration.
      </p>
      <div class="buttons">
        <button class="btn success">START FREE TRIAL</button>
        <button class="btn outline">WATCH DEMOS</button>
      </div>
    </div>

    <div class="hero-image">
      <div class="circle">
        <img src="https://via.placeholder.com/250" alt="user" />
      </div>
    </div>
  </section>

  <!-- GENESYS CLOUD SOFTPHONE -->
  <section class="softphone">
    <h2>Embedded Softphone</h2>

    <iframe
      id="genesysFrame"
      src="https://apps.usw2.pure.cloud/crm/embeddableFramework.html"
      allow="microphone; camera"
    ></iframe>
  </section>

  <script src="script.js"></script>
</body>
</html>
