<!DOCTYPE html>
<html>
<head>
    <title>Home-Grown CRM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My CRM Dashboard</h1>

    <!-- ✅ Softphone Iframe -->
    <div class="softphone">
        <iframe 
            id="softphone"
            allow="camera *; microphone *"
            src="https://apps.usw2.pure.cloud/crm/index.html?crm=framework-local-secure"
            width="400"
            height="600"
            style="border:1px solid #ccc;">
        </iframe>
    </div>

    <!-- ✅ Add Customer Form -->
    <div class="form-container">
        <h2>Add Customer</h2>
        <input type="text" id="name" placeholder="Customer Name">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="phone" placeholder="Phone">
        <button onclick="addCustomer()">Add</button>
    </div>

    <!-- ✅ Customer List -->
    <h2>Customer List</h2>
    <table id="customerTable">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Action</th>
        </tr>
    </table>

    <!-- ✅ JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
