<!DOCTYPE html>
<html>
<head>
    <title>Home-Grown CRM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My CRM Dashboard</h1>

    <!-- ✅ Add Customer Section -->
    <div class="form-container">
        <h2>Add Customer</h2>

        <input type="text" id="name" placeholder="Customer Name">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="phone" placeholder="Phone">
        <button onclick="addCustomer()">Add</button>

        <!-- ✅ ✅ Integration placed UNDER Add Customer -->
        <div class="softphone">
            <iframe 
                id="softphone"
                allow="camera *; microphone *"
                src="https://apps.usw2.pure.cloud/crm/index.html?crm=framework-local-secure"
                width="400"
                height="300"
                style="border:1px solid #ccc; margin-top:20px;">
            </iframe>
        </div>
    </div>

    <!-- ✅ Customer List -->
    <h2>Customer List</h2>
    <table id="customerTable">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Action</th>
        </tr>
    </table>

    <!-- ✅ JS file -->
    <script src="script.js"></script>

</body>
</html>
