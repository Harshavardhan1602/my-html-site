<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cognizant CRM</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">CRM</div>
        <ul>
            <li>🏠</li>
            <li>👥</li>
            <li>📞</li>
            <li>📊</li>
        </ul>
    </aside>

    <!-- Main Content -->
    <div class="main">

        <!-- Contacts List -->
        <div class="contacts">
            <h3>People</h3>
            <input type="text" placeholder="Search">

            <div class="contact">John Miller</div>
            <div class="contact active">Bessie Warren</div>
            <div class="contact">Jenny Wilson</div>
            <div class="contact">Devon Lane</div>
        </div>

        <!-- Center Panel -->
        <div class="details">
            <h2>Bessie Warren</h2>
            <p>Senior Manager</p>

            <div class="cards">
                <div class="card">
                    <h4>Tasks</h4>
                    <p>Follow up with marketing team</p>
                </div>

                <div class="card">
                    <h4>Messages</h4>
                    <p>You: Let's connect tomorrow</p>
                </div>
            </div>
        </div>

    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">

        <!-- Contact Info -->
        <div class="info-box">
            <h3>Contact Info</h3>
            <p>Email: user@email.com</p>
            <p>Phone: +1 123456789</p>
        </div>

        <!-- ✅ Genesys Softphone -->
        <div class="softphone-box">
            <div class="softphone-header">Softphone</div>

            <iframe
                id="softphone"
                src="https://apps.usw2.pure.cloud/crm/embeddableFramework.html"
                allow="camera *; microphone *; autoplay *"
                title="Genesys Cloud Softphone">
            </iframe>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
