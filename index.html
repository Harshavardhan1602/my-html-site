<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Integration - Genesys Cloud</title>

  <!-- Config -->
  <meta name="client-id" content="226182a8-bb53-435b-bc3c-2140f077768f">
  <meta name="region" content="usw2.pure.cloud">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="container">

  <!-- LEFT LOGIN -->
  <div class="left-panel">
    <div class="logo">salesforce</div>

    <div class="login-box">
      <h3>Login to CRM</h3>

      <input type="text" placeholder="Username" />
      <input type="password" placeholder="Password" />

      <button onclick="login()">Log In</button>

      <label class="remember">
        <input type="checkbox" />
        Remember me
      </label>

      <a href="#">Forgot Password?</a>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <h1>Trailblazer Community</h1>
    <p>
      The reimagined Trailblazer Community is here. 
      Learn, connect, and grow your CRM ecosystem.
    </p>

    <button class="cta">JOIN THE COMMUNITY</button>
  </div>

</div>

<!-- FLOATING SOFTPHONE PANEL -->
<div id="softphone-container" class="softphone hidden">
  <div class="softphone-header">
    <span>📞 Genesys Cloud</span>
    <button onclick="toggleSoftphone()">✖</button>
  </div>

  <iframe id="softphone-frame"></iframe>
</div>

<!-- FLOAT BUTTON -->
<button id="openSoftphone" onclick="toggleSoftphone()">📞</button>

<script src="app.js"></script>
</body>
</html>
